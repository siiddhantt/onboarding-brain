name: Feature request
description: Suggest an improvement to Onboarding Brain
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Describe who needs this and how it improves their onboarding workflow.
        Link the relevant PRD section or community discussion when available.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: The situation you hit, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you found, and why they fall short.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I would be willing to open a pull request for it
